name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --mode github
        env:
          VITE_AI_API_URL: ${{ secrets.VITE_AI_API_URL }}

      - name: Generate SPA route entry points
        run: |
          cp dist/index.html dist/404.html
          routes=(
            "properties"
            "projects"
            "about"
            "contact"
            "property/oak-residence"
            "property/pacific-heights"
            "property/north-hills-no-04"
            "property/canyon-house"
            "property/mesa-09"
            "property/studio-12"
            "property/cliff-residence"
            "property/park-16"
            "property/ridge-19"
            "property/union-22"
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
